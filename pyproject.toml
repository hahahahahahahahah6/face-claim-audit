[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "face-claim-audit"
version = "0.1.0"
description = "Offline audit of documented picture-face claims against Python source"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
face-claim-audit = "face_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["face_claim_audit*"]
